name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test-virtual-bus:
    name: tests (python ${{ matrix.python }}, virtual bus)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: >
          pytest
          --junitxml=reports/junit.xml
          --html=reports/report.html --self-contained-html
          --traceability=reports/traceability
      - name: Publish requirement coverage
        if: always()
        run: cat reports/traceability.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python }}
          path: reports/

  test-socketcan:
    name: tests (Linux SocketCAN vcan0, simulator as separate process)
    # The vcan kernel module ships in linux-modules-extra, which is not always
    # published for the kernel on the newest runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up vcan0
        id: vcan
        run: |
          sudo apt-get update
          sudo apt-get install -y can-utils
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vcan || true
          fi
          if sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::vcan kernel module unavailable on kernel $(uname -r); skipping SocketCAN tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - run: pip install -e ".[dev]"
        if: steps.vcan.outputs.available == 'true'
      - name: Start BMS simulator
        if: steps.vcan.outputs.available == 'true'
        run: |
          nohup canbench-sim --interface socketcan --channel vcan0 > sim.log 2>&1 &
          sleep 1
      - name: Capture bus traffic
        if: steps.vcan.outputs.available == 'true'
        run: nohup candump -L vcan0 > reports-candump.log 2>&1 &
      - name: Run black-box integration tests
        if: steps.vcan.outputs.available == 'true'
        env:
          CANBENCH_INTERFACE: socketcan
          CANBENCH_CHANNEL: vcan0
          CANBENCH_EXTERNAL: "1"
        run: >
          pytest tests/integration
          --junitxml=reports/junit.xml
          --html=reports/report.html --self-contained-html
          --traceability=reports/traceability
      - name: Collect logs
        if: always()
        run: |
          mkdir -p reports
          cp sim.log reports/ || true
          mv reports-candump.log reports/candump.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-socketcan
          path: reports/
